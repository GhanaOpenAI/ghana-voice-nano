# @package _global_
# Ghana Voice Nano: single-speaker Matcha-TTS finetune, warm-started with finetune_ckpt.

defaults:
  - override /data: nano.yaml
  - override /callbacks: nano.yaml

tags: ["ghana-voice-nano"]
run_name: nano

trainer:
  max_epochs: 500
  check_val_every_n_epoch: 1

model:
  n_vocab: 178   # base symbol table; keeps the warm-start embedding loadable as-is
  # Decoder trains on a random ~2 s crop per step (172 frames). The single biggest speedup.
  out_size: 172
